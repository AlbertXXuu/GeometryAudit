name: Recorded experiment checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recorded-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B scripts/check_repository.py
      - run: python -B scripts/review_recorded.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/motorcycle/run_baseline.py --help
      - run: python -B scripts/tum/run_tum.py --help
